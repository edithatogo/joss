name: Tests
on: [push, pull_request]
jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: 3.3.3
          bundler-cache: true
      - name: Install Elasticsearch
        uses: ankane/setup-elasticsearch@31ef32c3c8f64eb06167398f88ca6582fd2aad6d # v1
        with:
          elasticsearch-version: 9
      - name: Verify Elasticsearch connection and create index
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          echo $ELASTICSEARCH_URL
          curl -fsSL "$ELASTICSEARCH_URL/_cat/health?h=status"
          curl -X PUT $ELASTICSEARCH_URL/joss-production
      - name: Run tests
        env:
          ELASTICSEARCH_URL: http://localhost:9200
          PGUSER: postgres
          PGPASSWORD: secret
          RAILS_ENV: test
          GH_SECRET: 12345
        run: |
          bin/rails db:create
          bin/rails db:schema:load
          bin/rails spec
